syntax = "proto3";

import "google/protobuf/empty.proto";

message SetThemeRequest {
  string theme = 1;
}

message WindowState {
  bool isMaximized = 1;
}

message SelectDirectoryRequest {
  string title = 1;
  string default_path = 2;
}

message SelectDirectoryResponse {
  bool canceled = 1;
  string path = 2;
  string error_message = 3;
}

message SelectFilesRequest {
  string title = 1;
  string default_path = 2;
}

message SelectFilesResponse {
  bool canceled = 1;
  repeated string paths = 2;
  string error_message = 3;
}

message AnnotationProject {
  string id = 1;
  string name = 2;
  string root_dir = 3;
  string created_at = 4;
  string updated_at = 5;
}

message AnnotationRecord {
  string id = 1;
  string project_id = 2;
  string image_path = 3;
  string label = 4;
  string bbox_json = 5;
  string meta_json = 6;
  string updated_at = 7;
}

message ListAnnotationProjectsRequest {
  string database_dir = 1;
}

message ListAnnotationProjectsResponse {
  repeated AnnotationProject projects = 1;
}

message UpsertAnnotationProjectRequest {
  string database_dir = 1;
  AnnotationProject project = 2;
}

message DeleteAnnotationProjectRequest {
  string database_dir = 1;
  string id = 2;
}

message ListAnnotationsByProjectRequest {
  string database_dir = 1;
  string project_id = 2;
}

message ListAnnotationsResponse {
  repeated AnnotationRecord annotations = 1;
}

message UpsertAnnotationRequest {
  string database_dir = 1;
  AnnotationRecord annotation = 2;
}

message DeleteAnnotationRequest {
  string database_dir = 1;
  string id = 2;
}

message DefaultGlobalConfigDirResponse {
  string path = 1;
}

message SaveAppConfigToDiskRequest {
  string global_config_dir = 1;
  string app_config_json = 2;
}

message GetAppConfigFromDiskRequest {
  /** 为空时使用默认全局配置目录 */
  string global_config_dir = 1;
}

message GetAppConfigFromDiskResponse {
  string app_config_json = 1;
  bool exists = 2;
  string error_message = 3;
}

message MigrateGlobalConfigDirRequest {
  string old_dir = 1;
  string new_dir = 2;
}

message MigrateGlobalConfigDirResponse {
  bool success = 1;
  string error_message = 2;
  int32 copied_count = 3;
}

message ValidateProjectDirectoryRequest {
  string path = 1;
}

message ValidateProjectDirectoryResponse {
  bool is_empty = 1;
  string error_message = 2;
}

message ProjectItem {
  string id = 1;
  string name = 2;
  string project_info = 3;
  string project_type = 4;
  string storage_type = 5;
  string local_path = 6;
  string remote_ip = 7;
  string remote_port = 8;
  string updated_at = 9;
  string config_file_path = 10;
  repeated ProjectTag tags = 11;
}

/** 骨架模板点（归一化 0~1），与项目 JSON / renderer 中 SkeletonTemplateSpec 对应 */
message SkeletonTemplatePointPb {
  string id = 1;
  string label = 2;
  double x = 3;
  double y = 4;
}

message SkeletonTemplateEdgePb {
  string from = 1;
  string to = 2;
}

message SkeletonTemplatePb {
  int32 version = 1;
  repeated SkeletonTemplatePointPb points = 2;
  repeated SkeletonTemplateEdgePb edges = 3;
}

message ProjectTag {
  string name = 1;
  string color = 2;
  /** "plain" | "skeleton"；空或未设置视为 plain */
  string kind = 3;
  SkeletonTemplatePb skeleton_template = 4;
}

message CreateProjectRequest {
  string global_config_dir = 1;
  string name = 2;
  string project_info = 3;
  string project_type = 4;
  string storage_type = 5;
  string local_path = 6;
  string remote_ip = 7;
  string remote_port = 8;
  repeated ProjectTag tags = 9;
}

message CreateProjectResponse {
  ProjectItem project = 1;
  string error_message = 2;
}

message ListProjectsRequest {
  string global_config_dir = 1;
}

message ListProjectsResponse {
  repeated ProjectItem projects = 1;
}

message GetProjectRequest {
  string global_config_dir = 1;
  string id = 2;
}

message GetProjectResponse {
  ProjectItem project = 1;
  bool found = 2;
}

message UpdateProjectRequest {
  string global_config_dir = 1;
  string id = 2;
  string name = 3;
  string project_info = 4;
  repeated ProjectTag tags = 5;
}

message UpdateProjectResponse {
  ProjectItem project = 1;
  bool found = 2;
  string error_message = 3;
}

message DeleteProjectRequest {
  string global_config_dir = 1;
  string id = 2;
}

message DeleteProjectResponse {
  bool found = 1;
  string error_message = 2;
}

message TaskUploadSourceEntry {
  string source_path = 1;
  string file_name = 2;
  bytes content = 3;
}

message SaveTaskFilesRequest {
  string global_config_dir = 1;
  string database_dir = 2;
  string project_id = 3;
  string task_id = 4;
  string subset = 5;
  repeated TaskUploadSourceEntry files = 6;
}

message SaveTaskFilesResponse {
  string error_message = 1;
  repeated string saved_paths = 2;
}

/** 导入仅包含图片的 ZIP 到任务目录。 */
message ImportTaskImageZipRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  string zip_path = 5;
}

message ImportTaskImageZipResponse {
  string error_message = 1;
  repeated string saved_paths = 2;
  int32 imported_image_count = 3;
}

/** 统计图片 ZIP 内可导入的图片数量（不解压到任务目录）。 */
message CountTaskImageZipRequest {
  string zip_path = 1;
}

message CountTaskImageZipResponse {
  string error_message = 1;
  int32 image_count = 2;
}

/** 导入已标注 ZIP 到任务目录。 */
message ImportAnnotatedTaskZipRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  string zip_path = 5;
  /** xanylabeling / yolo-detect / yolo-obb / yolo-segment / yolo-pose */
  string import_format = 6;
}

message ImportAnnotatedTaskZipResponse {
  string error_message = 1;
  repeated string saved_paths = 2;
  int32 imported_image_count = 3;
  int32 imported_annotation_count = 4;
  string detected_format = 5;
}

/** 导入已选中的图片及同名标注文件到任务目录。 */
message ImportAnnotatedTaskFilesRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  repeated string image_paths = 5;
  repeated string label_paths = 6;
  repeated string yolo_class_paths = 7;
  /** xanylabeling / yolo-detect / yolo-obb / yolo-segment / yolo-pose */
  string import_format = 8;
}

message ImportAnnotatedTaskFilesResponse {
  string error_message = 1;
  int32 imported_image_count = 2;
  int32 imported_annotation_count = 3;
  string detected_format = 4;
}

message StartAnnotatedTaskZipImportRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  string zip_path = 5;
  string import_format = 6;
}

message StartAnnotatedTaskZipImportResponse {
  string error_message = 1;
  string job_id = 2;
}

message StartTaskDeleteRequest {
  string global_config_dir = 1;
  string database_dir = 2;
  string project_id = 3;
  string task_id = 4;
}

message StartTaskDeleteResponse {
  string error_message = 1;
  string job_id = 2;
}

message ListAnnotatedTaskImportJobsResponse {
  repeated AnnotatedTaskImportJobItem jobs = 1;
}

message GetAnnotatedTaskImportJobRequest {
  string job_id = 1;
}

message GetAnnotatedTaskImportJobResponse {
  bool found = 1;
  AnnotatedTaskImportJobItem job = 2;
  string error_message = 3;
}

message AnnotatedTaskImportJobItem {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  string import_format = 5;
  string status = 6;
  int32 progress = 7;
  string message = 8;
  int32 imported_image_count = 9;
  int32 imported_annotation_count = 10;
  string detected_format = 11;
  string created_at = 12;
  string updated_at = 13;
}

message DefaultDatabaseDirResponse {
  string path = 1;
}

message ListTaskFilesRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string database_dir = 4;
  int32 offset = 5;
  int32 limit = 6;
}

message TaskFileItem {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  string subset = 4;
  string file_path = 5;
  string created_at = 6;
  /** 图片旁存在非空同名 .json 标注文件 */
  bool has_annotation = 7;
}

message ListTaskFilesResponse {
  repeated TaskFileItem files = 1;
  string error_message = 2;
  bool has_more = 3;
}

/** 导出页等场景：单次扫盘统计图片与标注数量，避免分页 IPC 传完整路径列表。 */
message CountTaskSourceStatsRequest {
  string global_config_dir = 1;
  string project_id = 2;
  /** 为空则统计项目下全部任务 */
  repeated string task_ids = 3;
}

message CountTaskSourceStatsResponse {
  int32 image_count = 1;
  int32 annotation_count = 2;
  string error_message = 3;
}

/** 项目任务列表项（与 renderer TaskItem 对齐，持久化于 global_config_dir/project-tasks/） */
message ProjectTaskItem {
  string id = 1;
  string name = 2;
  string subset = 3;
  int32 file_count = 4;
  string created_at = 5;
  string updated_at = 6;
  string cover_color = 7;
  /** 已标注图片数（导入或统计写入；未设置时项目页延迟加载） */
  int32 annotated_file_count = 8;
}

message ListProjectTasksRequest {
  string global_config_dir = 1;
  string project_id = 2;
}

message ListProjectTasksResponse {
  repeated ProjectTaskItem tasks = 1;
  string error_message = 2;
}

message SaveProjectTasksRequest {
  string global_config_dir = 1;
  string project_id = 2;
  repeated ProjectTaskItem tasks = 3;
}

message SaveProjectTasksResponse {
  string error_message = 1;
}

message GetProjectTaskAnnotatedCountsRequest {
  string database_dir = 1;
  string project_id = 2;
}

message TaskAnnotatedCountItem {
  string task_id = 1;
  int32 annotated_image_count = 2;
}

message GetProjectTaskAnnotatedCountsResponse {
  repeated TaskAnnotatedCountItem items = 1;
  string error_message = 2;
}

/** 项目导出页 Version 配置（JSON 文档，与 renderer ExportVersionDoc 对齐） */
message GetProjectExportVersionsRequest {
  string global_config_dir = 1;
  string project_id = 2;
}

message GetProjectExportVersionsResponse {
  string json_text = 1;
  bool exists = 2;
  string error_message = 3;
}

message SaveProjectExportVersionsRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string json_text = 3;
}

message SaveProjectExportVersionsResponse {
  string error_message = 1;
}

message ReadImageFileRequest {
  string path = 1;
}

message ReadImageFileResponse {
  bytes content = 1;
  string error_message = 2;
}

message ReadImageAnnotationRequest {
  string image_path = 1;
}

message ReadImageAnnotationResponse {
  string json_text = 1;
  bool exists = 2;
  string error_message = 3;
}

message WriteImageAnnotationRequest {
  string image_path = 1;
  string json_text = 2;
}

message WriteImageAnnotationResponse {
  string json_path = 1;
  string error_message = 2;
}

/** 主进程读/写标注 JSON，仅 IPC 传入新增 shapes，避免超大 json_text 导致闪退。 */
message AppendImageAnnotationShapesRequest {
  string image_path = 1;
  string shapes_json = 2;
  int32 image_width = 3;
  int32 image_height = 4;
}

message AppendImageAnnotationShapesResponse {
  string json_path = 1;
  string error_message = 2;
}

message DeleteImageAnnotationRequest {
  string image_path = 1;
}

message DeleteImageAnnotationResponse {
  string error_message = 1;
}

message DeleteTaskAnnotationsRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string database_dir = 4;
}

message DeleteTaskAnnotationsResponse {
  string error_message = 1;
}

message GetImageFileInfoRequest {
  string path = 1;
}

message GetImageFileInfoResponse {
  bool exists = 1;
  int64 size_bytes = 2;
  string format = 3;
  int32 channel_count = 4;
  string extension = 5;
  string error_message = 6;
  int32 width = 7;
  int32 height = 8;
}

message DeleteTaskImageRequest {
  string image_path = 1;
}

message DeleteTaskImageResponse {
  bool deleted = 1;
  bool annotation_deleted = 2;
  string error_message = 3;
}

message DownloadTaskImageRequest {
  string image_path = 1;
}

message DownloadTaskImageResponse {
  bool canceled = 1;
  string saved_path = 2;
  string error_message = 3;
}

message StartDatasetExportRequest {
  string global_config_dir = 1;
  string project_id = 2;
  string task_id = 3;
  string export_format = 4;
  bool keep_project_structure = 5;
  int32 train_boundary = 6;
  int32 val_boundary = 7;
  string version_name = 8;
  repeated TaskNameItem task_names = 9;
  /** 为 true 时导出为 .zip；为 false 时在所选目录下生成数据集文件夹 */
  bool compress_to_zip = 10;
}

message TaskNameItem {
  string task_id = 1;
  string task_name = 2;
}

message StartDatasetExportResponse {
  bool canceled = 1;
  string job_id = 2;
  string error_message = 3;
}

message ListExportJobsResponse {
  repeated ExportJobItem jobs = 1;
}

message ExportJobItem {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  string version_name = 4;
  string export_format = 5;
  bool keep_project_structure = 6;
  string output_dir = 7;
  string status = 8;
  int32 progress = 9;
  string message = 10;
  string created_at = 11;
  string updated_at = 12;
}

/** 从主进程启动便携 Python 后端（Windows：backend 根目录须含 start.ps1 与 python-embed） */
message StartLocalBackendRequest {
  /** 用户选择的 backend 根目录（须含 start.ps1）；空则自动查找 */
  string backend_directory = 1;
}

message StartLocalBackendResponse {
  bool ok = 1;
  string error_message = 2;
  /** 调用前 /health 已可用，未再拉起新进程 */
  bool already_running = 3;
}

/** 结束由本应用主进程 spawn 的本地 FastAPI（uvicorn）子进程；不会结束用户手动启动的同名端口服务 */
message StopLocalBackendResponse {
  /** 是否成功结束了本应用拉起的进程 */
  bool stopped = 1;
  /** stopped=false 时的说明 */
  string message = 2;
}

/** 主进程探测本地 FastAPI /health（避免渲染进程受 CORS / 安全策略影响） */
message LocalBackendStatusResponse {
  bool reachable = 1;
}

/** 主进程探测远程 FastAPI /health（用于打包版避免渲染进程网络策略差异） */
message ProbeRemoteBackendHealthRequest {
  string protocol = 1;
  string host = 2;
  string port = 3;
  string base_path = 4;
  int32 timeout_ms = 5;
}

message ProbeRemoteBackendHealthResponse {
  bool ok = 1;
  string health_url = 2;
  string reason = 3;
  int32 http_status = 4;
}

/** 主进程代理 HTTP 请求（用于将后端请求统一转到主进程网络栈） */
message ProxyBackendHttpRequest {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  int32 timeout_ms = 5;
}

message ProxyBackendHttpResponse {
  bool ok = 1;
  int32 status = 2;
  string status_text = 3;
  map<string, string> headers = 4;
  bytes body = 5;
  string error_message = 6;
}

/** 主进程按本地图片路径发起 multipart 上传，避免大体积二进制跨 IPC 复制 */
message ProxyBackendImageUploadRequest {
  string url = 1;
  string image_path = 2;
  string payload_json = 3;
  int32 timeout_ms = 4;
}

message ProxyBackendImageUploadResponse {
  bool ok = 1;
  int32 status = 2;
  string status_text = 3;
  map<string, string> headers = 4;
  bytes body = 5;
  string error_message = 6;
}

/** SAM session WebSocket（任务页生命周期内单连接） */
message ConnectBackendSamWsRequest {
  string url = 1;
  string client_id = 2;
}

message ConnectBackendSamWsResponse {
  bool ok = 1;
  string error_message = 2;
}

message DisconnectBackendSamWsRequest {}

message DisconnectBackendSamWsResponse {
  bool ok = 1;
}

message SamWsPrepareImageRequest {
  string model_id = 1;
  string image_path = 2;
  double infer_scale = 3;
  string runtime_slot = 4;
  int32 timeout_ms = 5;
}

message SamWsPrepareImageResponse {
  bool ok = 1;
  string error_message = 2;
  string response_json = 3;
}

message SamWsSendJsonRequest {
  string json_text = 1;
  int32 timeout_ms = 2;
}

message SamWsSendJsonResponse {
  bool ok = 1;
  string error_message = 2;
  string response_json = 3;
}

message IsBackendSamWsConnectedRequest {}

message IsBackendSamWsConnectedResponse {
  bool connected = 1;
}

/** YOLO 训练监控 WebSocket（训练页/历史详情生命周期内单连接） */
message ConnectBackendYoloMonitorWsRequest {
  string url = 1;
  string client_id = 2;
}

message ConnectBackendYoloMonitorWsResponse {
  bool ok = 1;
  string error_message = 2;
}

message DisconnectBackendYoloMonitorWsRequest {}

message DisconnectBackendYoloMonitorWsResponse {
  bool ok = 1;
}

message IsBackendYoloMonitorWsConnectedRequest {}

message IsBackendYoloMonitorWsConnectedResponse {
  bool connected = 1;
}

message YoloMonitorWsSendJsonRequest {
  string json_text = 1;
  int32 timeout_ms = 2;
}

message YoloMonitorWsSendJsonResponse {
  bool ok = 1;
  string error_message = 2;
  string response_json = 3;
}

message YoloMonitorWsFetchResultImageRequest {
  string job_slug = 1;
  string path = 2;
  int32 timeout_ms = 3;
}

message YoloMonitorWsFetchResultImageResponse {
  bool ok = 1;
  bytes body = 2;
  string content_type = 3;
  string error_message = 4;
}

/** 将本地 zip 复制到 backend/external/temp/<训练名>/dataset.zip */
message CopyYoloTrainingDatasetZipRequest {
  string backend_directory = 1;
  string source_zip_path = 2;
  string training_name = 3;
}

message CopyYoloTrainingDatasetZipResponse {
  bool ok = 1;
  string error_message = 2;
  string dataset_zip_path = 3;
}

/** 主进程从本地路径经 WebSocket 分片上传数据集 zip。 */
message StartYoloDatasetZipUploadRequest {
  string global_config_dir = 1;
  string job_slug = 2;
  string source_zip_path = 3;
}

message StartYoloDatasetZipUploadResponse {
  string job_id = 1;
  string error_message = 2;
}

message GetYoloDatasetZipUploadJobRequest {
  string job_id = 1;
}

message YoloDatasetZipUploadJobItem {
  string id = 1;
  string status = 2;
  int32 progress = 3;
  string phase = 4;
  string message = 5;
  string data_yaml = 6;
  string dataset_zip_filename = 7;
  string error_message = 8;
}

message GetYoloDatasetZipUploadJobResponse {
  bool found = 1;
  YoloDatasetZipUploadJobItem job = 2;
  string error_message = 3;
}

/** 主进程经 WebSocket 上传基座 .pt 权重（上传前连接、完成后断开）。 */
message UploadYoloBaseModelFromPathRequest {
  string global_config_dir = 1;
  string job_slug = 2;
  string source_pt_path = 3;
  string family = 4;
  string task = 5;
}

message UploadYoloBaseModelFromPathResponse {
  bool ok = 1;
  string response_json = 2;
  string error_message = 3;
}

/** 主进程从本地路径经 WebSocket 分片上传 YOLO batch 模型文件（data.yaml / .pt）。 */
message StartYoloBatchFileUploadRequest {
  string global_config_dir = 1;
  string model_slug = 2;
  string source_path = 3;
  /** data_yaml | weights */
  string kind = 4;
  /** 可选：与渲染进程当前连接的后端一致（优先于 global_config_dir 解析） */
  string api_root = 5;
}

message StartYoloBatchFileUploadResponse {
  string job_id = 1;
  string error_message = 2;
}

message GetYoloBatchFileUploadJobRequest {
  string job_id = 1;
}

message YoloBatchFileUploadJobItem {
  string id = 1;
  string status = 2;
  int32 progress = 3;
  string message = 4;
  string kind = 5;
  string data_yaml = 6;
  string weights_pt = 7;
  string error_message = 8;
}

message GetYoloBatchFileUploadJobResponse {
  bool found = 1;
  YoloBatchFileUploadJobItem job = 2;
  string error_message = 3;
}

/** @deprecated 使用 StartYoloBatchFileUpload */
message StartYoloBatchWeightsUploadRequest {
  string global_config_dir = 1;
  string model_slug = 2;
  string source_pt_path = 3;
}

message StartYoloBatchWeightsUploadResponse {
  string job_id = 1;
  string error_message = 2;
}

message GetYoloBatchWeightsUploadJobRequest {
  string job_id = 1;
}

message YoloBatchWeightsUploadJobItem {
  string id = 1;
  string status = 2;
  int32 progress = 3;
  string message = 4;
  string weights_pt = 5;
  string error_message = 6;
}

message GetYoloBatchWeightsUploadJobResponse {
  bool found = 1;
  YoloBatchWeightsUploadJobItem job = 2;
  string error_message = 3;
}

/** YOLO batch 自动标注推理 WebSocket（任务批量 predict 生命周期内单连接） */
message ConnectBackendYoloBatchPredictWsRequest {
  string url = 1;
  string client_id = 2;
}

message ConnectBackendYoloBatchPredictWsResponse {
  bool ok = 1;
  string error_message = 2;
}

message DisconnectBackendYoloBatchPredictWsRequest {}

message DisconnectBackendYoloBatchPredictWsResponse {
  bool ok = 1;
}

message IsBackendYoloBatchPredictWsConnectedRequest {}

message IsBackendYoloBatchPredictWsConnectedResponse {
  bool connected = 1;
}

message YoloBatchPredictImageRequest {
  string model_slug = 1;
  string image_path = 2;
  int32 timeout_ms = 3;
}

message YoloBatchPredictImageResponse {
  bool ok = 1;
  string error_message = 2;
  string response_json = 3;
}

/** 子进程批量自动标注（每批 10 张，持久 WS 推理 + 写标注）。 */
message StartYoloBatchAutoAnnotateJobRequest {
  string api_root = 1;
  string model_slug = 2;
  repeated string image_paths = 3;
  repeated string allowed_labels = 4;
}

message StartYoloBatchAutoAnnotateJobResponse {
  string job_id = 1;
  string error_message = 2;
}

message GetYoloBatchAutoAnnotateJobRequest {
  string job_id = 1;
}

message YoloBatchAutoAnnotateJobItem {
  string id = 1;
  string status = 2;
  int32 done = 3;
  int32 total = 4;
  string current_file = 5;
  string message = 6;
  string error_message = 7;
}

message GetYoloBatchAutoAnnotateJobResponse {
  bool found = 1;
  YoloBatchAutoAnnotateJobItem job = 2;
}

message CancelYoloBatchAutoAnnotateJobRequest {
  string job_id = 1;
}

message CancelYoloBatchAutoAnnotateJobResponse {
  bool ok = 1;
}

/** 将本地 yaml / pt 复制到 backend/external/model_temp/<模型 slug>/ */
message CopyYoloBatchModelFileRequest {
  string backend_directory = 1;
  string model_slug = 2;
  string source_path = 3;
  /** data_yaml | weights */
  string kind = 4;
}

message CopyYoloBatchModelFileResponse {
  bool ok = 1;
  string error_message = 2;
  string dest_path = 3;
}

/** 选择保存目录后，经 WebSocket 分片下载训练模型 .pt */
message DownloadYoloTrainingModelRequest {
  string job_slug = 1;
  string file_path = 2;
  string suggested_file_name = 3;
}

message DownloadYoloTrainingModelResponse {
  bool canceled = 1;
  string saved_path = 2;
  string error_message = 3;
  /** 非空：HTTP 下载已在主进程后台进行，请轮询 GetYoloModelDownloadStatus */
  string download_id = 4;
}

message GetYoloModelDownloadStatusRequest {
  string download_id = 1;
}

message GetYoloModelDownloadStatusResponse {
  string status = 1;
  string saved_path = 2;
  string error_message = 3;
}

